name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: catches upstream API changes (Paper, Mojang, Fabric, Purpur)
  workflow_dispatch:

jobs:
  offline:
    name: offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm test

  live:
    name: live downloads + real server boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:live
        env:
          RUN_NETWORK_TESTS: "1"
          RUN_BOOT_TEST: "1"
