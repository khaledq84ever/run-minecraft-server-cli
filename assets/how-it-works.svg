<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="330" rx="16" fill="#120c06"/>
  <text x="600" y="52" font-size="30" font-weight="800" fill="#fbbf24" text-anchor="middle">HOW IT WORKS · كيف يشتغل</text>
  <!-- step boxes -->
  <g text-anchor="middle">
    <g transform="translate(70,90)">
      <rect width="300" height="180" rx="14" fill="#1c1207" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="52" font-size="44">⬇️</text>
      <text x="150" y="98" font-size="22" font-weight="700" fill="#fbbf24">1 · Download</text>
      <text x="150" y="130" font-size="17" fill="#e7d3a8">Get start-yourserver.bat</text>
      <text x="150" y="156" font-size="17" fill="#a16207">from your CraftHost dashboard</text>
    </g>
    <text x="410" y="195" font-size="40" fill="#f59e0b">➜</text>
    <g transform="translate(450,90)">
      <rect width="300" height="180" rx="14" fill="#1c1207" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="52" font-size="44">🖱️</text>
      <text x="150" y="98" font-size="22" font-weight="700" fill="#fbbf24">2 · Double-click</text>
      <text x="150" y="130" font-size="17" fill="#e7d3a8">Menu starts your server</text>
      <text x="150" y="156" font-size="17" fill="#a16207">and waits until it's online</text>
    </g>
    <text x="790" y="195" font-size="40" fill="#f59e0b">➜</text>
    <g transform="translate(830,90)">
      <rect width="300" height="180" rx="14" fill="#1c1207" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="52" font-size="44">🎮</text>
      <text x="150" y="98" font-size="22" font-weight="700" fill="#fbbf24">3 · Play</text>
      <text x="150" y="130" font-size="17" fill="#e7d3a8">Address copied to clipboard</text>
      <text x="150" y="156" font-size="17" fill="#a16207">paste it in Minecraft → join!</text>
    </g>
  </g>
  <text x="600" y="308" font-size="16" fill="#7c5c1e" text-anchor="middle">No Java setup · No port forwarding · No config — the server runs in the cloud, the .bat just remote-controls it</text>
</svg>
