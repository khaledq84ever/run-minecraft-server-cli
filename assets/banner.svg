<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1207"/><stop offset=".55" stop-color="#120c06"/><stop offset="1" stop-color="#0d0a05"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#amber)"/>
  <!-- pixel blocks decoration -->
  <g fill="#f59e0b" opacity=".14">
    <rect x="1020" y="40" width="48" height="48"/><rect x="1068" y="88" width="48" height="48"/>
    <rect x="1116" y="40" width="48" height="48"/><rect x="1164" y="136" width="48" height="48"/>
    <rect x="1068" y="184" width="48" height="48"/><rect x="1164" y="232" width="48" height="48"/>
    <rect x="60" y="240" width="40" height="40"/><rect x="100" y="280" width="40" height="40"/><rect x="20" y="280" width="40" height="40"/>
  </g>
  <text x="90" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#fbbf24">run-minecraft-server-cli</text>
  <text x="90" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#e7d3a8">Start, stop &amp; control your Minecraft server — one double-click or one command.</text>
  <text x="90" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#a16207" direction="rtl" unicode-bidi="bidi-override">شغّل سيرفر ماينكرافت بضغطة واحدة</text>
  <g transform="translate(90,268)">
    <rect width="360" height="56" rx="12" fill="#0a0704" stroke="#f59e0b" stroke-width="2"/>
    <text x="24" y="36" font-family="Consolas, monospace" font-size="24" fill="#fbbf24">&gt; start-my-server.bat</text>
    <rect x="330" y="14" width="14" height="28" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
