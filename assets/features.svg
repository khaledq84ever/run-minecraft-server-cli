      <text x="24" y="80" font-size="15" fill="#e7d3a8">.bat needs only Windows 10+.</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">CLIs need only Node 18+.</text>
    </g>
    <g transform="translate(810,255)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="24" y="44" font-size="30">🌍</text><text x="66" y="44" font-size="20" font-weight="700" fill="#fbbf24">EN + AR</text>
      <text x="24" y="80" font-size="15" fill="#e7d3a8">Built for the CraftHost platform —</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">English &amp; Arabic dashboard.</text>
