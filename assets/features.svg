<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="420" rx="16" fill="#120c06"/>
  <text x="600" y="56" font-size="30" font-weight="800" fill="#fbbf24" text-anchor="middle">FEATURES · المميزات</text>
  <g>
    <g transform="translate(50,95)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="24" y="44" font-size="30">⚡</text><text x="66" y="44" font-size="20" font-weight="700" fill="#fbbf24">One-click start</text>
      <text x="24" y="80" font-size="15" fill="#e7d3a8">Double-click the .bat — server starts,</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">address lands in your clipboard.</text>
    </g>
    <g transform="translate(430,95)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="24" y="44" font-size="30">🎛️</text><text x="66" y="44" font-size="20" font-weight="700" fill="#fbbf24">Full menu control</text>
      <text x="24" y="80" font-size="15" fill="#e7d3a8">Start · Stop · Restart · Live status</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">with players, address &amp; version.</text>
    </g>
    <g transform="translate(810,95)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="24" y="44" font-size="30">🔑</text><text x="66" y="44" font-size="20" font-weight="700" fill="#fbbf24">Token security</text>
      <text x="24" y="80" font-size="15" fill="#e7d3a8">Private 48-hex token per server —</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">no password stored in the file.</text>
    </g>
    <g transform="translate(50,255)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="24" y="44" font-size="30">💻</text><text x="66" y="44" font-size="20" font-weight="700" fill="#fbbf24">mc-local CLI</text>
      <text x="24" y="80" font-size="15" fill="#e7d3a8">Run a real server on YOUR pc:</text>
      <text x="24" y="104" font-size="15" fill="#e7d3a8">install paper/vanilla/fabric/purpur.</text>
    </g>
    <g transform="translate(430,255)">
      <rect width="340" height="130" rx="12" fill="#1c1207" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.5"/>
