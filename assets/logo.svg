<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1207"/><stop offset="1" stop-color="#0d0a05"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="464" height="464" rx="88" fill="none" stroke="#f59e0b" stroke-opacity=".25" stroke-width="4"/>
  <!-- grass block -->
  <g transform="translate(120,110)">
    <rect x="0" y="40" width="240" height="200" rx="18" fill="#3f2d12"/>
    <rect x="0" y="40" width="240" height="64" rx="18" fill="url(#amber)"/>
