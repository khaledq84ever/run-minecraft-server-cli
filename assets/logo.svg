    <rect x="28" y="86" width="36" height="34" fill="url(#amber)"/>
    <rect x="108" y="86" width="28" height="26" fill="url(#amber)"/>
    <rect x="182" y="86" width="34" height="30" fill="url(#amber)"/>
    <!-- play triangle -->
