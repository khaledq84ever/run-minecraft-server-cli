  </g>
  <text x="240" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">RUN MC SERVER</text>
  <text x="240" y="446" font-family="Consolas, monospace" font-size="26" fill="#a16207" text-anchor="middle">one click · CLI · .bat</text>
